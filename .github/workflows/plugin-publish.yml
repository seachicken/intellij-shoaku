name: Publish Plugin

on:
  push:
    tags:
      - "v*"

jobs:
  build-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: actions/setup-node@v6
      with:
        node-version-file: 'server/.nvmrc'

    - run: npm test
    - run: npm ci
    - run: npm run build

    - uses: actions/upload-artifact@v4
      with:
        name: server-dist
        path: server/dist

  publish-plugin:
    needs: build-node
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/download-artifact@v4
      with:
        name: server-dist
        path: server/dist

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Set version
      run: |
        TAG=${{ github.ref_name }}
        echo "VERSION=${TAG#v}" >> $GITHUB_ENV

    - name: Publish Plugin to JetBrains Marketplace
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      run: |
        ./gradlew publishPlugin -PpluginVersion=$VERSION

    - name: Upload to GitHub Releases
      if: "!contains(github.ref_name, 'beta')"
      run: gh release create --title ${{ github.ref_name }} --generate-notes ${{ github.ref_name }} ./build/distributions/intellij-shoaku-${VERSION}.zip

    - name: Upload to GitHub Releases for pre-release
      if: "contains(github.ref_name, 'beta')"
      run: gh release create --title ${{ github.ref_name }} --generate-notes --prerelease ${{ github.ref_name }} ./build/distributions/intellij-shoaku-${VERSION}.zip
